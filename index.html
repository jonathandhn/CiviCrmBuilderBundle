<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title><%= title %></title>
    <link href="<%= pathGjsCss ? pathGjsCss : 'https://unpkg.com/grapesjs@' + gjsVersion + '/dist/css/grapes.min.css' %>" rel="stylesheet">
    <script src="<%= pathGjs ? pathGjs : 'https://unpkg.com/grapesjs@' + gjsVersion %>"></script>
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="gjs" style="height: 0; overflow: hidden">
      <div style="margin: 100px 100px 25px; padding: 25px; font: caption">
        CiviCRM Builder development preview
      </div>
    </div>

    <script>
      window.onload = () => {
        window.editor = grapesjs.init({
          height: '100%',
          container: '#gjs',
          showOffsets: true,
          noticeOnUnload: false,
          storageManager: false,
          fromElement: true,
          plugins: ['<%= name %>'],
        });
      };
    </script>
  </body>
</html>
